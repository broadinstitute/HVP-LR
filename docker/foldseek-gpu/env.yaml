# Foldseek GPU image deps — source-built, not conda. Sibling to
# docker/foldseek/env.yaml; this variant adds CUDA toolkit for the
# ProstT5 sequence-to-3Di prediction path. Bump VERSION in Makefile
# (and FOLDSEEK_COMMIT in Dockerfile) together when changing the
# upstream pin.
#
# Apt package versions below are candidates resolved against
# debian:bookworm-slim (bookworm + bookworm-updates + bookworm-security)
# at the snapshot date shown. The Dockerfile does NOT pin these — Debian
# security updates rotate them within bookworm's lifetime. Re-snapshot
# when bumping FOLDSEEK_COMMIT.

upstream:
  repo: https://github.com/steineggerlab/foldseek
  branch: master
  commit: 718d42176d2f67d36a60866fedfb881f8d5a7ebf
  release_marker: 10

base_image:
  ref: debian:bookworm-slim
  digest: sha256:96e378d7e6531ac9a15ad505478fcc2e69f371b10f5cdf87857c4b8188404716

apt_snapshot_date: 2026-06-12

cuda:
  major_version: 12.6
  toolkit_packages_build:
    - cuda-nvcc-12-6
    - cuda-cudart-dev-12-6
    - libcublas-dev-12-6
  runtime_packages:
    - cuda-cudart-12-6
    - libcublas-12-6
  keyring_url: https://developer.download.nvidia.com/compute/cuda/repos/debian12/x86_64/cuda-keyring_1.1-1_all.deb
  cmake_architectures: "75-real;80-real;86-real;89-real;90"
  supported_gpu_generations:
    - Turing (T4, RTX 20xx)
    - Ampere (A100, RTX 30xx)
    - Ada Lovelace (RTX 40xx, L4)
    - Hopper (H100)

build_deps_apt:
  build-essential: 12.9
  cmake: 3.25.1-1
  ninja-build: 1.11.1-2
  curl: 7.88.1-10+deb12u14
  xxd: 2:9.0.1378-2+deb12u2
  ca-certificates: 20230311+deb12u1
  zlib1g-dev: 1:1.2.13.dfsg-1
  libbz2-dev: 1.0.8-5+b1
  libatomic1: 12.2.0-14+deb12u1

build_toolchain:
  rustup:
    installer: https://sh.rustup.rs
    profile: minimal
    target_host: x86_64-unknown-linux-gnu
    toolchain: stable (resolved at build time; not pinned upstream)

runtime_deps_apt:
  gawk: 1:5.2.1-2
  bash: 5.2.15-2+b13
  grep: 3.8-5
  procps: 2:4.0.2-3
  libstdc++6: 12.2.0-14+deb12u1
  libgomp1: 12.2.0-14+deb12u1
  libatomic1: 12.2.0-14+deb12u1
  zlib1g: 1:1.2.13.dfsg-1
  libbz2-1.0: 1.0.8-5+b1
  wget: 1.21.3-1+deb12u1
  tar: 1.34+dfsg-1.2+deb12u1
  aria2: 1.36.0-1
  ca-certificates: 20230311+deb12u1

binaries_installed:
  amd64: foldseek_avx2 (CUDA-linked; entrypoint symlinked directly — no SSE4.1 fallback in CUDA build)

gpu_support: true
gpu_runtime_requirements:
  - NVIDIA driver compatible with CUDA 12.6 (>= 545)
  - nvidia-container-toolkit on host
  - Container launched with --gpus all (Docker) or equivalent
  - Compute capability >= 7.5 (Turing or newer)
