# MMseqs2 image deps — source-built, not conda. This file documents the
# inputs that determine the image contents; it is not consumed by any build
# step. Bump VERSION in Makefile (and MMSEQS_COMMIT in Dockerfile) together
# when changing the upstream pin.
#
# Apt package versions below are the candidates resolved against the
# debian:bookworm-slim base image (bookworm + bookworm-updates +
# bookworm-security) at the snapshot date shown. The Dockerfile does NOT
# pin these by version — Debian security updates rotate them within
# bookworm's lifetime. Re-snapshot when bumping MMSEQS_COMMIT (run the
# `apt-cache policy` loop in a debian:bookworm-slim container).

upstream:
  repo: https://github.com/soedinglab/MMseqs2
  release_tag: 18-8cc5c
  commit: 8cc5ce367b5638c4306c2d7cfc652dd099a4643f

base_image:
  ref: debian:bookworm-slim
  digest: sha256:96e378d7e6531ac9a15ad505478fcc2e69f371b10f5cdf87857c4b8188404716

apt_snapshot_date: 2026-06-16

build_deps_apt:
  build-essential: 12.9
  cmake: 3.25.1-1
  curl: 7.88.1-10+deb12u14
  xxd: 2:9.0.1378-2+deb12u2
  ca-certificates: 20230311+deb12u1
  zlib1g-dev: 1:1.2.13.dfsg-1
  libbz2-dev: 1.0.8-5+b1
  libatomic1: 12.2.0-14+deb12u1

build_deps_apt_cross:
  crossbuild-essential-amd64: 12.9
  crossbuild-essential-arm64: 12.9
  "zlib1g-dev:amd64": 1:1.2.13.dfsg-1
  "libbz2-dev:amd64": 1.0.8-5+b1
  "zlib1g-dev:arm64": 1:1.2.13.dfsg-1
  "libbz2-dev:arm64": 1.0.8-5+b1

runtime_deps_apt:
  gawk: 1:5.2.1-2
  bash: 5.2.15-2+b13
  grep: 3.8-5
  procps: 2:4.0.2-3
  libstdc++6: 12.2.0-14+deb12u1
  libgomp1: 12.2.0-14+deb12u1
  libatomic1: 12.2.0-14+deb12u1
  zlib1g: 1:1.2.13.dfsg-1
  libbz2-1.0: 1.0.8-5+b1
  wget: 1.21.3-1+deb12u1
  tar: 1.34+dfsg-1.2+deb12u1
  aria2: 1.36.0-1
  ca-certificates: 20230311+deb12u1

binaries_installed:
  amd64: mmseqs_sse2, mmseqs_sse41, mmseqs_avx2 (selected at runtime by util/mmseqs_wrapper.sh)
  arm64: mmseqs_arch (entrypoint symlinked directly)

gpu_support: false
