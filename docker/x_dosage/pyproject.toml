[project]
name = "karyotype-qc"
version = "0.1.0"
description = "Sex-chromosome karyotyping from host coverage for sample-swap QC (T2T-CHM13v2.0)"
readme = "../../analysis/x_dosage/HANDOFF.md"
requires-python = ">=3.11"
# Core (rx_sex.py, calibrate.py) is stdlib-only on purpose — tomllib is stdlib on 3.11+.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
