# x_dosage image deps — documents the inputs that determine image contents.
# Not consumed by any build step (see Dockerfile). The scripts are stdlib-only,
# so there are NO pip or conda packages; bump VERSION in the Makefile and the
# X_DOSAGE_VERSION ARG in the Dockerfile together.

base_image:
  ref: python:3.12-slim-bookworm
  digest: pinned via apt at build time; bookworm-slim resolves to the latest published patch

apt_snapshot_date: 2026-08-25

runtime_deps_apt:
  bash: "*"          # WDL command interpreter
  grep: "*"
  gawk: "*"          # classify-task output parsing
  coreutils: "*"
  procps: "*"        # `free -g` in the WDL resource preamble
  gzip: "*"
  ca-certificates: "*"

pip_packages: {}     # none — scripts are Python stdlib only (tomllib needs >=3.11)

python: "3.12"       # provides tomllib

baked_scripts:       # canonical home; copied to /opt/x_dosage in the image
  - rx_sex.py            # classifier (the WDL runs this)
  - calibrate.py         # per-platform calibration
  - aggregate_to_1mb.py  # re-bin fine mosdepth windows to 1Mb
  - scan_aneuploidy.py   # aneuploidy candidate finder
  - select_tier2.py      # euploid panel selector
  - summary_to_manifest.py
  - config.example.toml
  - configs/short_read.toml   # calibrated short-read config (default)

gpu_support: false
