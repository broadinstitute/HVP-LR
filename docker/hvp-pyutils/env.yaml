# hvp-pyutils — the pure-python glue/summary layer. Every task whose only
# "tool" is pandas/pysam scripting runs here instead of dragging a heavy tool
# image. Serves SkaniAnnotate, BinSummary, MagSummary, ReadRescue,
# MergeContigsRescue, ConcatProteinFastas, AnnotationTransfer,
# ViralContigSummary, ViralOverallSummary. Pins verbatim from base env.
name: base
channels: [conda-forge, bioconda]
dependencies:
  - setuptools>=78.1.1   # CVE-2025-47273 (base env ships 70.3.0)
  - python=3.12.13
  - biopython=1.87
  - pandas=3.0.3
  - numpy=1.26.4
  - pysam=0.24.0
  - seqkit=2.13.0        # MergeContigsRescue, MagSummary, ConcatProteinFastas
  - samtools=1.23.1      # ReadRescue
  - pigz=2.8
  - zstd=1.5.7
  - procps-ng
