# hvp-binning — the four binners + DAS_Tool used by the MAG pipeline. All share
# one conda solve and are python-3.12-compatible, so they live together.
# jgi_summarize_bam_contig_depths ships inside metabat2. Serves JgiDepth,
# MetaBAT2, MaxBin2, SemiBin2, DASTool.
name: base
channels: [conda-forge, bioconda]
dependencies:
  - metabat2=2.18_23_gc869c52   # also provides jgi_summarize_bam_contig_depths
  - maxbin2=2.2.7
  - semibin=2.2.1               # SemiBin2
  - das_tool=1.1.7
  - pigz=2.8
  - procps-ng
