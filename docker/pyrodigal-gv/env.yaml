# pyrodigal-gv image deps — pip-installed wheels on a python:3.12-slim base.
# This file documents the inputs that determine the image contents; it is
# not consumed by any build step. Bump VERSION in the Makefile and the two
# ARG pins in the Dockerfile together when changing the pyrodigal-gv pin.

upstream:
  pyrodigal_gv:
    repo: https://github.com/althonos/pyrodigal-gv
    release_tag: v0.3.2
    pypi_version: 0.3.2
  pyrodigal:
    repo: https://github.com/althonos/pyrodigal
    pypi_version: 3.7.1
    note: pyrodigal-gv 0.3.2 depends on pyrodigal ~=3.0; pinned exactly here for reproducibility

base_image:
  ref: python:3.12-slim-bookworm
  digest: pinned via pip + apt at build time; bookworm-slim resolves to the latest published patch

apt_snapshot_date: 2026-06-16

runtime_deps_apt:
  bash: 5.2.15-2+b13
  grep: 3.8-5
  gawk: 1:5.2.1-2
  procps: 2:4.0.2-3
  wget: 1.21.3-1+deb12u1
  tar: 1.34+dfsg-1.2+deb12u1
  gzip: 1.12-1
  ca-certificates: 20230311+deb12u1

pip_packages:
  pyrodigal: "3.7.1"
  pyrodigal-gv: "0.3.2"

wheel_compatibility:
  amd64: manylinux2014_x86_64 / manylinux_2_17_x86_64 / manylinux_2_28_x86_64
  arm64: manylinux2014_aarch64 / manylinux_2_17_aarch64 / manylinux_2_28_aarch64

gpu_support: false
