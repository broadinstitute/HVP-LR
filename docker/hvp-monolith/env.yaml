name: base
# All entries pinned to versions confirmed installed by a successful local
# amd64 build. Build hashes intentionally omitted so the same spec resolves
# on arm64. To re-pin after an intentional upgrade, run a local build and
# `micromamba list -n base`.
channels:
  - conda-forge
  - bioconda
dependencies:
  # Read QC & Sequence Utilities
  - fastqc=0.12.1
  - multiqc=1.35
  - seqkit=2.13.0

  # PacBio HiFi Alignment
  # pbmm2 dropped: bioconda has no linux-aarch64 build (PacBio has not
  # published one). Use `minimap2 -x map-hifi` instead for HiFi reads —
  # the same minimap2 binary pbmm2 wraps internally.
  - minimap2=2.31        # general-purpose long-read aligner; HiFi via -x map-hifi
  - samtools=1.23.1

  # Metagenome Assembly
  - hifiasm_meta=hamtv0.3.5    # HiFi-specific metagenome assembler
  - flye=2.9.6                 # run with --meta flag for metagenome mode (metaFlye)
  - metamdbg=1.4               # long-read metagenome assembler (binary: metaMDBG)
  - myloasm=0.5.1              # metagenomic assembler

  # Binning
  - metabat2=2.18_23_gc869c52
  - maxbin2=2.2.7
  - concoct=1.1.0
  - semibin=2.2.1              # SemiBin2
  - das_tool=1.1.7             # DAS Tool - integrates results from multiple binners

  # Bin Quality Assessment
  # checkm2 moved to its own sidecar env (env-checkm2.yaml). bioconda
  # checkm2 1.1.0 hard-pins tensorflow=2.17, which has no linux-aarch64
  # conda build. The sidecar pip-installs TF 2.17 (PyPI ships the
  # aarch64 wheel) plus checkm2 1.1.0 from source.

  # Genome Comparison / ANI
  - skani=0.3.2

  # Taxonomic Classification
  - kraken2=2.17.1
  - bracken=3.1
  - diamond=2.2.0              # protein-level classification; also a dependency of vConTACT2, CheckM2, VIBRANT, geNomad

  # Viral Identification & Classification
  - genomad=1.12.0             # viral/plasmid detection (current best-in-class)
  - checkv=1.1.0               # viral genome completeness assessment
  # The following tools live in sidecar conda envs (see env-*.yaml + Dockerfile).
  # All are exposed via wrapper shims in /usr/local/bin so users don't need
  # to know which env they live in.
  #
  #   * virsorter (>=2), vibrant    -> `viral`         (python=3.10)
  #     virsorter <=2.2.4 and vibrant require python <=3.10; conflicts with
  #     checkm2 1.1.0 (python >3.12).
  #   * deepvirfinder              -> `deepvirfinder` (python=3.6)
  #     Git-cloned tool; requires theano=1.0.3 + keras=2.2.4 (pip-installed).
  #   * vcontact2                  -> `vcontact2`     (python=3.8)
  #     Pinned to vcontact2=0.11.3 + diamond=2.1.24 + mcl + clusterone.

  # Python & Libraries
  - python=3.12.13
  - biopython=1.87
  - pandas=3.0.3
  - numpy=1.26.4
  - pysam=0.24.0
  - miniwdl=1.14.2

  # CLI Utilities
  - pigz=2.8                   # parallel gzip
  - parallel=20260422          # GNU parallel
  - jq=1.8.1
  - zstd=1.5.7
