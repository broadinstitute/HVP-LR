name: base
channels:
  - conda-forge
  - bioconda
dependencies:
  # Read QC & Sequence Utilities
  - fastqc
  - multiqc
  - seqkit

  # PacBio HiFi Alignment
  - pbmm2          # PacBio-native HiFi read aligner
  - minimap2        # general-purpose long-read aligner
  - samtools

  # Metagenome Assembly
  - hifiasm_meta    # HiFi-specific metagenome assembler
  - flye            # run with --meta flag for metagenome mode (metaFlye)
  - metamdbg        # long-read metagenome assembler
  - myloasm         # metagenomic assembler

  # Binning
  - metabat2
  - maxbin2
  - concoct
  - semibin         # SemiBin2
  - das_tool        # DAS Tool - integrates results from multiple binners

  # Bin Quality Assessment
  - checkm2

  # Genome Comparison / ANI
  - skani

  # Taxonomic Classification
  - kraken2
  - bracken
  - diamond         # protein-level classification; also a dependency of vConTACT2, CheckM2, VIBRANT, geNomad

  # Viral Identification & Classification
  - genomad         # viral/plasmid detection (current best-in-class)
  - checkv          # viral genome completeness assessment
  # The following tools live in sidecar conda envs (see env-*.yaml + Dockerfile).
  # All are exposed via wrapper shims in /usr/local/bin so users don't need
  # to know which env they live in.
  #
  #   * virsorter (>=2), vibrant    -> `viral`         (python=3.10)
  #     virsorter <=2.2.4 and vibrant require python <=3.10; conflicts with
  #     checkm2 1.1.0 (python >3.12).
  #   * deepvirfinder              -> `deepvirfinder` (python=3.6)
  #     Git-cloned tool; requires theano=1.0.3 + keras=2.2.4 (pip-installed).
  #   * vcontact2                  -> `vcontact2`     (python=3.8)
  #     Pinned to vcontact2=0.11.3 + diamond=2.1.24 + mcl + clusterone.

  # Python & Libraries
  # checkm2 1.1.0 requires python >3.12; older checkm2 needs python <=3.9.
  # 3.12 is the only python where both checkm2 and the other tools can co-exist.
  - python=3.12
  - biopython
  - pandas
  - numpy
  - pysam
  - miniwdl

  # CLI Utilities
  - pigz            # parallel gzip
  - parallel        # GNU parallel
  - jq
  - zstd
