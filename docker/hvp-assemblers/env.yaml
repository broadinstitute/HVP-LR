# hvp-assemblers — the alternate metagenome assemblers carried by the monolith
# but not used by the active myloasm-based pipeline. metamdbg is installed
# per-arch in the Dockerfile (bioconda ships 1.4 on linux-64, 1.2 on aarch64).
name: base
channels: [conda-forge, bioconda]
dependencies:
  - flye=2.9.6
  - hifiasm_meta=hamtv0.3.5
  - setuptools>=78.1.1     # CVE-2025-47273
  - procps-ng
