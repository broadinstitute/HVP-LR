# checkm2 — MAG completeness/contamination. Own python=3.10 env because
# checkm2 1.1.0 hard-pins tensorflow=2.17 (incompatible with the 3.12 stack).
# Spec verbatim from hvp-monolith env-checkm2.yaml. Serves CheckM2.
name: base
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10.20
  - pip=26.1.1
  - diamond=2.1.11
  - prodigal=2.6.3
  - lightgbm=4.6.0
  - h5py=3.16.0
  - scikit-learn=1.6.1
  - scipy=1.15.2
  - numpy=1.26.4
  - pandas=2.3.3
  - packaging=26.2
  - tqdm=4.67.3
  - requests=2.34.2
  - keras=3.12.0
  - procps-ng
  - pip:
      - tensorflow==2.17.0
      - https://github.com/chklovski/CheckM2/archive/refs/tags/1.1.0.tar.gz
