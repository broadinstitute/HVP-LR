# hvp-align — minimap2 + samtools + seqkit. Serves SpikeInRemoval and
# Minimap2AlignReads. Pins verbatim from hvp-monolith base env.
name: base
channels: [conda-forge, bioconda]
dependencies:
  - minimap2=2.31
  - samtools=1.23.1
  - seqkit=2.13.0
  - pigz=2.8
  - zstd=1.5.7
  - procps-ng            # `free -g` in WDL runtime preamble
