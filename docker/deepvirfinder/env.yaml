# deepvirfinder — DeepVirFinder (git-cloned in Dockerfile). Sidecar py3.6 env;
# theano==1.0.3 + keras==2.2.4 are pip-installed in the Dockerfile (py3.6 conda
# builds unreliable). Pins verbatim from hvp-monolith env-deepvirfinder.yaml.
name: base
channels: [conda-forge, bioconda]
dependencies:
  - python=3.6.15
  - h5py=3.1.0
  - numpy=1.19.5
  - scipy=1.5.3
  - biopython=1.79
  - diamond=2.1.10
  - pip=21.3.1
  - procps-ng
